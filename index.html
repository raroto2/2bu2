<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주요관리지표</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* 모바일 터치 및 부드러운 스크롤 */
        .scroll-container {
            -webkit-overflow-scrolling: touch;
        }
        /* 입력창 포커스 효과 */
        .input-focus:focus {
            outline: 2px solid #3b82f6;
            border-color: #3b82f6;
        }
        /* 웹킷 브라우저 스크롤바 미세화 */
        .scroll-container::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        .scroll-container::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .scroll-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans antialiased">

    <!-- 상단 헤더 영역 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
            <!-- 앱 타이틀 -->
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 text-white p-1.5 rounded-lg">
                    <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
                </div>
                <h1 class="text-xl font-bold text-slate-900 tracking-tight">주요관리지표</h1>
            </div>

            <!-- 연도 선택기 -->
            <div class="flex items-center bg-slate-100 rounded-lg p-1">
                <button onclick="adjustYear(-1)" class="p-1.5 hover:bg-white rounded-md transition text-slate-600 hover:text-slate-900">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>
                <span id="currentYearDisplay" class="px-4 font-semibold text-slate-700 min-w-[70px] text-center">2026년</span>
                <button onclick="adjustYear(1)" class="p-1.5 hover:bg-white rounded-md transition text-slate-600 hover:text-slate-900">
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 메인 네비게이션 (화면 탭) 및 액션 버튼 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-4 flex flex-col gap-4">
        
        <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3">
            <!-- 3대 분석판 전환 탭 -->
            <div class="flex bg-slate-200 p-1 rounded-lg self-start w-full sm:w-auto">
                <button id="tab-screen1" onclick="switchScreen('screen1')" class="flex-1 sm:flex-initial px-4 py-2 rounded-md font-medium text-sm transition-all shadow-none text-slate-600 hover:text-slate-900">
                    매출/인원현황
                </button>
                <button id="tab-screen2" onclick="switchScreen('screen2')" class="flex-1 sm:flex-initial px-4 py-2 rounded-md font-medium text-sm transition-all shadow-none text-slate-600 hover:text-slate-900">
                    갱신율/불량율
                </button>
                <button id="tab-screen3" onclick="switchScreen('screen3')" class="flex-1 sm:flex-initial px-4 py-2 rounded-md font-medium text-sm transition-all shadow-none text-slate-600 hover:text-slate-900">
                    기타효율등
                </button>
            </div>

            <!-- 즉시 줄 추가 및 엑셀 다운로드 -->
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <button onclick="addNewRow()" class="flex-1 sm:flex-initial bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm px-4 py-2.5 rounded-lg transition flex items-center justify-center gap-2 shadow-sm">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span>새 줄 추가</span>
                </button>
                <button onclick="exportToCSV()" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 font-medium text-sm px-3 py-2.5 rounded-lg transition flex items-center justify-center gap-2 shadow-sm" title="엑셀로 내보내기">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">엑셀용 내보내기</span>
                </button>
            </div>
        </div>

        <!-- 실적 관리 스프레드시트 영역 -->
        <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden flex flex-col">
            <div class="scroll-container overflow-x-auto w-full">
                <!-- table-auto 레이아웃을 채택하여 첫 구분 열이 입력 글자 길이에 맞춰 유연하게 조절되도록 지원 -->
                <table class="w-full text-left border-collapse table-auto min-w-[900px]">
                    <thead>
                        <tr class="bg-slate-100 text-slate-700 text-xs uppercase font-semibold border-b border-slate-200">
                            <!-- 구분 열만 sticky 고정 및 유동 너비 제공 -->
                            <th class="p-2 text-left sticky left-0 bg-slate-100 z-10 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] min-w-[85px]">구분</th>
                            <!-- 1월 ~ 12월 -->
                            <th class="p-1 w-[58px] text-right">1월</th>
                            <th class="p-1 w-[58px] text-right">2월</th>
                            <th class="p-1 w-[58px] text-right">3월</th>
                            <th class="p-1 w-[58px] text-right">4월</th>
                            <th class="p-1 w-[58px] text-right">5월</th>
                            <th class="p-1 w-[58px] text-right">6월</th>
                            <th class="p-1 w-[58px] text-right">7월</th>
                            <th class="p-1 w-[58px] text-right">8월</th>
                            <th class="p-1 w-[58px] text-right">9월</th>
                            <th class="p-1 w-[58px] text-right">10월</th>
                            <th class="p-1 w-[58px] text-right">11월</th>
                            <th class="p-1 w-[58px] text-right">12월</th>
                            <!-- 수동 년누적 / 년평균 -->
                            <th class="p-1 w-[68px] text-right bg-slate-50 font-bold text-blue-900 border-l border-slate-200">년누적</th>
                            <th class="p-1 w-[68px] text-right bg-slate-50 font-bold text-blue-900">년평균</th>
                            <!-- 줄 관리 -->
                            <th class="p-2 w-[70px] text-center border-l border-slate-200">관리</th>
                        </tr>
                    </thead>
                    <tbody id="spreadsheetBody" class="text-sm divide-y divide-slate-100">
                        <!-- 행들이 자바스크립트로 렌더링됩니다 -->
                    </tbody>
                </table>
            </div>
            
            <!-- 데이터가 없을 때의 대체 화면 -->
            <div id="noDataState" class="hidden py-16 text-center">
                <i data-lucide="folder-open" class="w-12 h-12 text-slate-300 mx-auto mb-3"></i>
                <p class="text-slate-500 text-sm">입력된 실적 데이터가 없습니다. 상단에서 새로운 줄을 추가해 주세요.</p>
            </div>
        </div>

    </main>

    <!-- 하단 라이선스/정보 영역 -->
    <footer class="bg-white border-t border-slate-200 py-4 mt-8">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-400">
            &copy; 2026 주요관리지표(KPI) 관리 대시보드. All rights reserved.
        </div>
    </footer>

    <!-- 자바스크립트 비즈니스 로직 -->
    <script>
        // 전역 상태 변수
        let currentScreen = 'screen1'; // screen1: 매출/인원, screen2: 갱신율/불량율, screen3: 기타효율등
        let currentYear = 2026;
        let originalDataset = [];

        // 초기 기본 데이터 정의 (센터명 제거 및 항목 슬림화)
        const defaultData = [
            // 화면 1: 매출/인원현황용
            { id: 'row-1', screen: 'screen1', year: 2026, category: '청주매출', m1: 52.3, m2: 48.0, m3: 61.2, m4: 55.4, m5: 50.1, m6: 62.8, m7: 49.9, m8: 45.6, m9: 58.0, m10: 64.1, m11: 58.9, m12: 67.5, yearAccum: 673.8, yearAvg: 56.2 },
            { id: 'row-2', screen: 'screen1', year: 2026, category: '대전매출', m1: 41.5, m2: 43.2, m3: 45.0, m4: 48.9, m5: 51.2, m6: 49.5, m7: 46.8, m8: 42.1, m9: 50.3, m10: 52.4, m11: 55.0, m12: 59.1, yearAccum: 585.0, yearAvg: 48.8 },
            { id: 'row-3', screen: 'screen1', year: 2026, category: '대구인원', m1: 15.0, m2: 15.0, m3: 16.0, m4: 16.0, m5: 17.0, m6: 17.0, m7: 17.0, m8: 16.0, m9: 18.0, m10: 18.0, m11: 19.0, m12: 19.0, yearAccum: 203.0, yearAvg: 16.9 },
            { id: 'row-4', screen: 'screen1', year: 2026, category: '렌트카실적', m1: 8.0, m2: 9.0, m3: 12.0, m4: 11.0, m5: 14.0, m6: 15.0, m7: 13.0, m8: 10.0, m9: 12.0, m10: 16.0, m11: 15.0, m12: 18.0, yearAccum: 153.0, yearAvg: 12.8 },
            
            // 화면 2: 갱신율/불량율용
            { id: 'row-5', screen: 'screen2', year: 2026, category: '청주갱신율', m1: 82.5, m2: 81.0, m3: 84.6, m4: 85.0, m5: 83.2, m6: 86.1, m7: 80.4, m8: 79.5, m9: 82.0, m10: 84.8, m11: 85.9, m12: 88.0, yearAccum: 1008.0, yearAvg: 84.0 },
            { id: 'row-6', screen: 'screen2', year: 2026, category: '대전갱신율', m1: 75.3, m2: 78.0, m3: 79.2, m4: 80.5, m5: 81.1, m6: 79.9, m7: 77.5, m8: 76.0, m9: 78.4, m10: 81.2, m11: 82.0, m12: 83.5, yearAccum: 952.6, yearAvg: 79.4 },
            { id: 'row-7', screen: 'screen2', year: 2026, category: '대구불량율', m1: 1.2, m2: 0.9, m3: 1.5, m4: 1.1, m5: 0.8, m6: 1.4, m7: 2.0, m8: 1.8, m9: 1.0, m10: 0.7, m11: 0.9, m12: 0.5, yearAccum: 13.8, yearAvg: 1.2 },

            // 화면 3: 기타효율등
            { id: 'row-8', screen: 'screen3', year: 2026, category: '청주렌트비율', m1: 15.2, m2: 16.5, m3: 14.8, m4: 17.0, m5: 18.2, m6: 19.5, m7: 16.0, m8: 15.1, m9: 17.4, m10: 18.9, m11: 20.1, m12: 21.0, yearAccum: 209.7, yearAvg: 17.5 },
            { id: 'row-9', screen: 'screen3', year: 2026, category: '대전기타효율', m1: 65.0, m2: 64.2, m3: 68.0, m4: 67.5, m5: 69.1, m6: 70.0, m7: 66.4, m8: 63.9, m9: 67.1, m10: 69.5, m11: 71.2, m12: 72.8, yearAccum: 814.7, yearAvg: 67.9 }
        ];

        // 앱 시작 시 데이터 로드
        window.onload = function() {
            loadInitialData();
            switchScreen('screen1'); // 디폴트는 매출/인원현황
            lucide.createIcons();
        };

        // 로컬스토리지에서 데이터를 읽어오거나 없을 시 디폴트 탑재
        function loadInitialData() {
            const savedData = localStorage.getItem('kpi_dashboard_dataset_v5');
            if (savedData) {
                try {
                    originalDataset = JSON.parse(savedData);
                } catch(e) {
                    originalDataset = [...defaultData];
                }
            } else {
                originalDataset = [...defaultData];
                saveToLocalStorage();
            }
        }

        // 로컬스토리지에 저장 (배경에서 자동 저장)
        function saveToLocalStorage() {
            localStorage.setItem('kpi_dashboard_dataset_v5', JSON.stringify(originalDataset));
        }

        // 연도 이동 제어
        function adjustYear(offset) {
            currentYear += offset;
            document.getElementById('currentYearDisplay').innerText = currentYear + '년';
            renderTable();
        }

        // 화면 탭 전환 제어
        function switchScreen(screenKey) {
            currentScreen = screenKey;
            
            // 탭 선택 스타일 전환
            const screens = ['screen1', 'screen2', 'screen3'];
            screens.forEach(s => {
                const btn = document.getElementById('tab-' + s);
                if (s === screenKey) {
                    btn.classList.remove('text-slate-600', 'hover:text-slate-900', 'shadow-none');
                    btn.classList.add('bg-white', 'text-slate-950', 'shadow-sm');
                } else {
                    btn.classList.remove('bg-white', 'text-slate-950', 'shadow-sm');
                    btn.classList.add('text-slate-600', 'hover:text-slate-900', 'shadow-none');
                }
            });

            renderTable();
        }

        // 구분(Category) 입력창의 가로 폭을 글자 길이에 맞춰 유동적으로 변화시키는 도우미 함수
        function adjustInputWidth(input) {
            const text = input.value || input.placeholder || '';
            let calculatedWidth = 0;
            // 한글은 대략 13px, 영문/숫자는 대략 7.5px로 계산하여 유동폭 계산
            for (let i = 0; i < text.length; i++) {
                const charCode = text.charCodeAt(i);
                if (charCode > 127) {
                    calculatedWidth += 13.5; 
                } else {
                    calculatedWidth += 7.5;  
                }
            }
            // 양측 패딩 여백 및 최소 폭을 감안하여 동적 세팅
            input.style.width = Math.max(80, calculatedWidth + 18) + 'px';
        }

        // 테이블 동적 렌더링
        function renderTable() {
            const tbody = document.getElementById('spreadsheetBody');
            const noDataState = document.getElementById('noDataState');
            tbody.innerHTML = '';

            // 현재 화면 및 연도와 일치하는 데이터만 필터링
            const filtered = originalDataset.filter(d => d.screen === currentScreen && d.year === currentYear);

            if (filtered.length === 0) {
                noDataState.classList.remove('hidden');
                return;
            } else {
                noDataState.classList.add('hidden');
            }

            filtered.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition-colors border-b border-slate-100 group';

                // 1. 구분 입력 셀 (직접 편집 가능한 유동폭 입력상자 적용 및 틀고정 유지)
                const tdCategory = document.createElement('td');
                tdCategory.className = 'p-2 sticky left-0 bg-white group-hover:bg-slate-50 z-10 border-r border-slate-100 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]';
                
                const categoryInput = document.createElement('input');
                categoryInput.type = 'text';
                categoryInput.className = 'category-input bg-transparent border-b border-transparent hover:border-slate-300 focus:border-blue-500 rounded px-1 py-0.5 text-xs font-bold text-slate-800 input-focus transition-all';
                categoryInput.value = row.category;
                categoryInput.placeholder = '구분 입력';
                
                // 입력 글자 길이에 맞춰 초기 폭 설정 및 실시간 변경 연동
                adjustInputWidth(categoryInput);
                categoryInput.oninput = function() {
                    adjustInputWidth(this);
                };
                categoryInput.onchange = function() {
                    row.category = this.value.trim();
                    saveToLocalStorage();
                };

                tdCategory.appendChild(categoryInput);
                tr.appendChild(tdCategory);

                // 2. 1월 ~ 12월 실적 입력 상자 조립
                for (let i = 1; i <= 12; i++) {
                    const monthKey = 'm' + i;
                    const val = row[monthKey] !== undefined ? Number(row[monthKey]).toFixed(1) : '0.0';
                    
                    const tdMonth = document.createElement('td');
                    tdMonth.className = 'p-1 text-right';
                    
                    const input = document.createElement('input');
                    input.type = 'number';
                    input.step = '0.1';
                    input.className = 'w-full bg-slate-50 border border-slate-200 rounded px-1.5 py-1 text-xs text-right input-focus text-slate-800 font-medium';
                    input.value = val;
                    
                    input.onchange = function() {
                        const parsed = parseFloat(this.value);
                        row[monthKey] = isNaN(parsed) ? 0.0 : Number(parsed.toFixed(1));
                        this.value = row[monthKey].toFixed(1);
                        saveToLocalStorage();
                    };
                    
                    tdMonth.appendChild(input);
                    tr.appendChild(tdMonth);
                }

                // 3. 수동 년누적 입력 상자
                const tdAccum = document.createElement('td');
                tdAccum.className = 'p-1 text-right bg-blue-50/30 border-l border-slate-200';
                
                const inputAccum = document.createElement('input');
                inputAccum.type = 'number';
                inputAccum.step = '0.1';
                inputAccum.className = 'w-full bg-blue-50/50 border border-blue-100 rounded px-1.5 py-1 text-xs text-right input-focus text-blue-900 font-semibold';
                inputAccum.value = row.yearAccum !== undefined ? Number(row.yearAccum).toFixed(1) : '0.0';
                
                inputAccum.onchange = function() {
                    const parsed = parseFloat(this.value);
                    row.yearAccum = isNaN(parsed) ? 0.0 : Number(parsed.toFixed(1));
                    this.value = row.yearAccum.toFixed(1);
                    saveToLocalStorage();
                };
                
                tdAccum.appendChild(inputAccum);
                tr.appendChild(tdAccum);

                // 4. 수동 년평균 입력 상자
                const tdAvg = document.createElement('td');
                tdAvg.className = 'p-1 text-right bg-blue-50/30';
                
                const inputAvg = document.createElement('input');
                inputAvg.type = 'number';
                inputAvg.step = '0.1';
                inputAvg.className = 'w-full bg-blue-50/50 border border-blue-100 rounded px-1.5 py-1 text-xs text-right input-focus text-blue-900 font-semibold';
                inputAvg.value = row.yearAvg !== undefined ? Number(row.yearAvg).toFixed(1) : '0.0';
                
                inputAvg.onchange = function() {
                    const parsed = parseFloat(this.value);
                    row.yearAvg = isNaN(parsed) ? 0.0 : Number(parsed.toFixed(1));
                    this.value = row.yearAvg.toFixed(1);
                    saveToLocalStorage();
                };
                
                tdAvg.appendChild(inputAvg);
                tr.appendChild(tdAvg);

                // 5. 간편 삭제 줄 관리 열
                const tdActions = document.createElement('td');
                tdActions.className = 'p-2 text-center border-l border-slate-200 whitespace-nowrap';
                
                const deleteBtn = document.createElement('button');
                deleteBtn.onclick = function() { deleteRow(row.id); };
                deleteBtn.className = 'text-rose-600 hover:text-rose-800 font-medium text-xs py-1 px-2 hover:bg-rose-50 rounded transition flex items-center justify-center gap-0.5 mx-auto';
                deleteBtn.innerHTML = `<i data-lucide="trash-2" class="w-3.5 h-3.5"></i><span>삭제</span>`;

                tdActions.appendChild(deleteBtn);
                tr.appendChild(tdActions);

                tbody.appendChild(tr);
            });

            // 생성된 아이콘 로드
            lucide.createIcons();
        }

        // 인라인 새 줄 즉시 추가
        function addNewRow() {
            const newRow = {
                id: 'row-' + Date.now(),
                screen: currentScreen,
                year: currentYear,
                category: '', // 비어있는 기본값 생성
                m1: 0.0, m2: 0.0, m3: 0.0, m4: 0.0, m5: 0.0, m6: 0.0,
                m7: 0.0, m8: 0.0, m9: 0.0, m10: 0.0, m11: 0.0, m12: 0.0,
                yearAccum: 0.0,
                yearAvg: 0.0
            };
            originalDataset.push(newRow);
            saveToLocalStorage();
            renderTable();

            // 추가된 빈 줄의 구분(Category) 입력창으로 자동 초점 이동
            setTimeout(() => {
                const inputs = document.querySelectorAll('.category-input');
                if (inputs.length > 0) {
                    const lastInput = inputs[inputs.length - 1];
                    lastInput.focus();
                }
            }, 50);
        }

        // 행 삭제
        function deleteRow(id) {
            originalDataset = originalDataset.filter(d => d.id !== id);
            saveToLocalStorage();
            renderTable();
        }

        // CSV 파일 저장 (엑셀용 다운로드)
        function exportToCSV() {
            const filtered = originalDataset.filter(d => d.screen === currentScreen && d.year === currentYear);
            if (filtered.length === 0) {
                return;
            }

            let csvContent = "\uFEFF"; // 한글 엑셀 깨짐방지 BOM 주입
            csvContent += "구분,1월,2월,3월,4월,5월,6월,7월,8월,9월,10월,11월,12월,년누적,년평균\n";

            filtered.forEach(row => {
                const cols = [
                    row.category || '미정',
                    row.m1.toFixed(1),
                    row.m2.toFixed(1),
                    row.m3.toFixed(1),
                    row.m4.toFixed(1),
                    row.m5.toFixed(1),
                    row.m6.toFixed(1),
                    row.m7.toFixed(1),
                    row.m8.toFixed(1),
                    row.m9.toFixed(1),
                    row.m10.toFixed(1),
                    row.m11.toFixed(1),
                    row.m12.toFixed(1),
                    row.yearAccum.toFixed(1),
                    row.yearAvg.toFixed(1)
                ];
                const rowStr = cols.map(v => `"${v}"`).join(",");
                csvContent += rowStr + "\n";
            });

            // 임시 다운로드 엘리먼트 생성 및 실행
            const filename = `주요관리지표_${currentYear}_${currentScreen}.csv`;
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            
            if (navigator.msSaveBlob) { 
                navigator.msSaveBlob(blob, filename);
            } else {
                link.href = URL.createObjectURL(blob);
                link.setAttribute("download", filename);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }
    </script>
</body>
</html>
